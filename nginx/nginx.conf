events {
    worker_connections 4096;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Optimization settings for high request throughput
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

    # Upstream Backend Load Balancer Cluster (Round-Robin)
    upstream billflow_backend_cluster {
        least_conn; # Route to backend with fewest active connections
        server backend1:5001 max_fails=3 fail_timeout=10s;
        server backend2:5001 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Frontend Static Files
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # API Proxy with Load Balancing
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://billflow_backend_cluster;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # SEO Sitemap & Robots
        location /sitemap.xml {
            proxy_pass http://billflow_backend_cluster/sitemap.xml;
        }

        location /robots.txt {
            proxy_pass http://billflow_backend_cluster/robots.txt;
        }
    }
}
