version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: billflow-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: billing-system
    volumes:
      - mongo-data:/data/db

  backend1:
    build:
      context: ./backend
    container_name: billflow-backend-1
    restart: always
    environment:
      - PORT=5001
      - MONGODB_URI=mongodb://mongodb:27017/billing-system
      - JWT_SECRET=production_super_secret_jwt_key_98765
      - NODE_ENV=production
    depends_on:
      - mongodb

  backend2:
    build:
      context: ./backend
    container_name: billflow-backend-2
    restart: always
    environment:
      - PORT=5001
      - MONGODB_URI=mongodb://mongodb:27017/billing-system
      - JWT_SECRET=production_super_secret_jwt_key_98765
      - NODE_ENV=production
    depends_on:
      - mongodb

  nginx-lb:
    image: nginx:alpine
    container_name: billflow-load-balancer
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend1
      - backend2

volumes:
  mongo-data:
